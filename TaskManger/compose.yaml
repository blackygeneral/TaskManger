name: taskflow
x-backend: &backend
 build: ./backend
 env_file: .env
 depends_on:
  db:
   condition: service_healthy
  redis:
   condition: service_healthy
services:
 db:
  image: postgres:18-alpine
  environment:
   POSTGRES_DB: ${POSTGRES_DB:-taskflow}
   POSTGRES_USER: ${POSTGRES_USER:-taskflow}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
  volumes:
   - postgres_data:/var/lib/postgresql
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
   interval: 5s
   timeout: 5s
   retries: 20
 redis:
  image: redis:7-alpine
  command: redis-server --appendonly yes
  volumes:
   - redis_data:/data
  healthcheck:
   test: ["CMD", "redis-cli", "ping"]
   interval: 5s
   timeout: 3s
   retries: 20
 migrate:
  <<: *backend
  command: python manage.py migrate --noinput
 backend:
  <<: *backend
  command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
  ports:
   - "127.0.0.1:8000:8000"
  depends_on:
   migrate:
    condition: service_completed_successfully
 worker:
  <<: *backend
  command: celery -A config worker -l INFO --concurrency=2
  depends_on:
   migrate:
    condition: service_completed_successfully
 beat:
  <<: *backend
  command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule
  depends_on:
   migrate:
    condition: service_completed_successfully
 frontend:
  build:
   context: ./frontend
   target: development
  environment:
   API_PROXY: http://backend:8000
  ports:
   - "127.0.0.1:5173:5173"
  depends_on:
   - backend
 mailpit:
  image: axllent/mailpit:v1.29
  ports:
   - "127.0.0.1:8025:8025"
   - "127.0.0.1:1025:1025"
volumes:
 postgres_data:
 redis_data:
